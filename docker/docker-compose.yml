# Local checkout, from the repository root:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
#
# Compose reads `${...}` values from a .env next to this file unless --env-file is given,
# so --env-file makes RECLINARR_PORT and the PostHog build arg come from the root .env.
#
# Run the published image without a checkout: see docker-compose.image.yml.

services:
  reclinarr:
    build:
      context: ..
      dockerfile: Dockerfile
    image: reclinarr:local
    container_name: reclinarr
    # Reaps orphaned processes (ffmpeg) and forwards signals to the entrypoint.
    init: true
    ports:
      - "${RECLINARR_PORT:-8787}:8787"
    env_file:
      - ../.env
    environment:
      # Inside the container nginx always listens on 8787; RECLINARR_PORT picks the host port.
      RECLINARR_PORT: "8787"
      RECLINARR_DATA_DIR: /data
    # Live transcode uses VAAPI when /dev/dri is mounted (Intel/AMD on a Linux host).
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA NVENC needs an ffmpeg with h264_nvenc (FFMPEG_PATH) and `gpus: all`.
    # macOS VideoToolbox is used when the API process runs on macOS, outside this container.
    volumes:
      - reclinarr-data:/data
      # Mount the same library path into Jellyfin so "Add to Library" is discoverable:
      #   /data/library/movies and /data/library/series
    restart: unless-stopped

volumes:
  reclinarr-data:
