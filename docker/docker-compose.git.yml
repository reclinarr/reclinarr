# Build & run Reclinarr from the public GitHub repository.
# Keep a local .env at the repository root (or create a folder with this compose file + .env).
#
#   cp .env.example .env   # fill in Jellyfin / Seerr / Dispatcharr
#   docker compose -f docker/docker-compose.git.yml up -d --build
#
# Image-only (no compose):
#   docker build -t reclinarr https://github.com/reclinarr/reclinarr.git
#   docker run --env-file .env -p 8787:8787 -v reclinarr-data:/data reclinarr

services:
  reclinarr:
    build:
      context: https://github.com/reclinarr/reclinarr.git#main
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_POSTHOG_PROJECT_KEY: ${EXPO_PUBLIC_POSTHOG_PROJECT_KEY:-${RECLINARR_POSTHOG_PROJECT_KEY:-}}
    image: reclinarr:git
    container_name: reclinarr
    ports:
      - "${RECLINARR_PORT:-8787}:8787"
    env_file:
      - ../.env
    environment:
      RECLINARR_DATA_DIR: /data
      RECLINARR_PUBLIC_URL: ${RECLINARR_PUBLIC_URL:-http://localhost:8787}
    # Live transcode uses VAAPI when /dev/dri is mounted (Intel/AMD on a Linux host).
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA NVENC needs an ffmpeg with h264_nvenc (FFMPEG_PATH) and `gpus: all`.
    # macOS VideoToolbox is used when the API process runs on macOS, outside this container.
    volumes:
      - reclinarr-data:/data
    restart: unless-stopped

volumes:
  reclinarr-data:
