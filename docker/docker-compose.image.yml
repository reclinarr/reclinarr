# Run the published Reclinarr image, no checkout needed.
# Put this file and a .env (from .env.example) in the same folder, then from that folder:
#
#   docker compose -f docker-compose.image.yml up -d
#
# Update with: docker compose -f docker-compose.image.yml pull && docker compose -f docker-compose.image.yml up -d

services:
  reclinarr:
    # `latest` is the newest release. Pin a version (0.1.0) or follow a minor line (0.1)
    # to control upgrades; `edge` tracks main.
    image: reclinarr/reclinarr:latest
    container_name: reclinarr
    # Reaps orphaned processes (ffmpeg) and forwards signals to the entrypoint.
    init: true
    ports:
      - "${RECLINARR_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      # Inside the container nginx always listens on 8787; RECLINARR_PORT picks the host port.
      RECLINARR_PORT: "8787"
      RECLINARR_DATA_DIR: /data
    # Live transcode uses VAAPI when /dev/dri is mounted (Intel/AMD on a Linux host).
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA NVENC needs an ffmpeg with h264_nvenc (FFMPEG_PATH) and `gpus: all`.
    # macOS VideoToolbox is used when the API process runs on macOS, outside this container.
    volumes:
      - reclinarr-data:/data
    restart: unless-stopped

volumes:
  reclinarr-data:
