name: Android TV

on:
  pull_request:
    paths:
      - "apps/tv/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-tv.yml"
  push:
    branches: [main]
    paths:
      - "apps/tv/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compile TV app and tv-input module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --no-audit --no-fund
      # apps/tv/android is generated, not committed.
      - name: Generate the native Android TV project
        working-directory: apps/tv
        env:
          EXPO_TV: "1"
        run: npx expo prebuild --platform android --no-install
      # One ABI keeps the build to compile coverage, not a release artifact.
      - name: Assemble debug build
        working-directory: apps/tv/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
